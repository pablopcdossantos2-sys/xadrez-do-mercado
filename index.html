const I18nCtx = createContext({ lang: 'en', t: (k) => k, setLang: () => {} });
const useT = () => useContext(I18nCtx);

function makeT(lang) {
  return (key, vars) => {
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.en;
    let s = dict[key] ?? TRANSLATIONS.en[key] ?? key;
    if (vars) for (const k of Object.keys(vars)) s = s.split(`{${k}}`).join(String(vars[k]));
    return s;
  };
}

function rankFromElo(elo, t) {
  if (elo < 1200) return { key: 'Novice',        label: t('rankNovice'),        color: '#9aa0b4' };
  if (elo < 1400) return { key: 'Developing',    label: t('rankDeveloping'),    color: '#2962FF' };
  if (elo < 1600) return { key: 'Consistent',    label: t('rankConsistent'),    color: '#26a69a' };
  if (elo < 1800) return { key: 'Sharp',         label: t('rankSharp'),         color: '#FF9800' };
  return               { key: 'Institutional', label: t('rankInstitutional'), color: '#ef5350' };
}

/* ============================================================================
   Sound (Web Audio API) — roadmap #28
============================================================================ */
const SOUND_KEY = 'tape_puzzle_sound';
function loadSoundPref() { try { const v = localStorage.getItem(SOUND_KEY); return v === null ? true : v === '1'; } catch (e) { return true; } }
function saveSoundPref(v) { try { localStorage.setItem(SOUND_KEY, v ? '1' : '0'); } catch (e) {} }

function useSound(enabled) {
  const ctxRef = useRef(null);
  const ensure = useCallback(() => {
    if (ctxRef.current) return ctxRef.current;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      ctxRef.current = new Ctx();
    } catch (e) { return null; }
    return ctxRef.current;
  }, []);
  const tone = useCallback((freq, duration, type = 'sine', volume = 0.07) => {
    if (!enabled) return;
    const ctx = ensure();
    if (!ctx) return;
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

============================================================================ */
const FREEZE_WINDOW_MS = 24 * 60 * 60 * 1000;

function emptyBucket() { return { n: 0, correct: 0, processMatch: 0, rSum: 0 }; }
function emptyBreakdown() { return { bySetup: {}, byTimeframe: {}, byDirection: {}, byInstrument: {} }; }
function recordBucket(obj, key, patch) {
  if (!obj[key]) obj[key] = emptyBucket();
  obj[key].n += 1;
  obj[key].correct += patch.correct ? 1 : 0;
  obj[key].processMatch += patch.processMatch ? 1 : 0;
  obj[key].rSum = +(obj[key].rSum + (patch.r || 0)).toFixed(2);
}
function cloneBreakdown(b) {
  const out = emptyBreakdown();
  for (const k of ['bySetup', 'byTimeframe', 'byDirection', 'byInstrument']) {
    out[k] = {};
    for (const key of Object.keys(b?.[k] || {})) out[k][key] = { ...emptyBucket(), ...b[k][key] };
  }
  return out;
}
function migrateStats(s) {
  const base = {
    elo: 1236, solved: 0, correct: 0, processMatch: 0,
    streak: 0, bestStreak: 0, rSum: 0,
    breakdown: emptyBreakdown(),
    freezeAvailable: 1,        // roadmap #23
    freezeUsedAt: 0,
  };
  if (!s) return base;
  const merged = { ...base, ...s };
  if (typeof merged.processMatch !== 'number') merged.processMatch = 0;
  if (!merged.breakdown) merged.breakdown = emptyBreakdown();
  if (typeof merged.freezeAvailable !== 'number') merged.freezeAvailable = 1;
  if (typeof merged.freezeUsedAt !== 'number') merged.freezeUsedAt = 0;
  return merged;
}
function isFreezeReady(stats) {
  if (stats.freezeAvailable > 0) return true;
  return stats.freezeUsedAt > 0 && (Date.now() - stats.freezeUsedAt > FREEZE_WINDOW_MS);
}

const JOURNAL_KEY = 'tape_puzzle_journal_v1';
const JOURNAL_MAX = 200;
function loadJournal() { try { const raw = localStorage.getItem(JOURNAL_KEY); return raw ? JSON.parse(raw) : []; } catch (e) { return []; } }
function saveJournal(arr) { try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(arr.slice(-JOURNAL_MAX))); } catch (e) {} }
function appendJournalEntry(entry) { const arr = loadJournal(); arr.push(entry); const capped = arr.slice(-JOURNAL_MAX); saveJournal(capped); return capped; }
function clearJournalStorage() { try { localStorage.removeItem(JOURNAL_KEY); } catch (e) {} }

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}
function exportJournalJson(entries) {
  downloadBlob(`tape-puzzles-journal-${Date.now()}.json`, JSON.stringify(entries, null, 2), 'application/json');
}
function exportJournalCsv(entries) {
  const headers = ['timestamp_iso','puzzle_id','instrument','timeframe','setup_id','setup_en','decision','ai_decision','process_match','outcome','r','skip_reason','skip_reason_match','freeze_used','trap'];

    e.decision ?? '', e.aiDecision ?? '',

}

/* ============================================================================
   Market data
============================================================================ */
const TF_SEC = { '1m': 60, '5m': 300, '15m': 900, '1h': 3600 };
const TF_VOL_MULT = { '1m': 0.6, '5m': 1.0, '15m': 1.8, '1h': 3.2 };

function generateMarketData(timeframe, instrument) {
  const stepSec = TF_SEC[timeframe] || 900;
  const volUnit = TF_VOL_MULT[timeframe] || 1;
  const basePrice = instrument === 'MES' ? 4200 : 15500;
  const volatility = (timeframe === '1m' ? 0.9 : timeframe === '5m' ? 2.4 : timeframe === '15m' ? 5.5 : 11) * volUnit;
  const bars = []; const total = 120; const decisionIdx = 82;
  const sessionStart = new Date(); sessionStart.setHours(9, 30, 0, 0);
  let t = Math.floor(sessionStart.getTime() / 1000) - decisionIdx * stepSec;
  let price = basePrice + (Math.random() - 0.5) * 200;
  let trendBias = (Math.random() - 0.5) * 1.5;
  for (let i = 0; i < total; i++) {
    if (i === 0 || i % 22 === 0) trendBias = (Math.random() - 0.5) * 3.2;
    const localBias = i > decisionIdx - 8 && i <= decisionIdx ? trendBias * 1.6 : trendBias;
    const open = price;
    const move = localBias + (Math.random() - 0.5) * volatility;
    const close = open + move;
    const hi = Math.max(open, close) + Math.random() * volatility * 0.55;
    const lo = Math.min(open, close) - Math.random() * volatility * 0.55;
    const vol = Math.round(2500 + Math.random() * 4500 + Math.abs(move) * 800);
    bars.push({ time: t, open: +open.toFixed(2), high: +hi.toFixed(2), low: +lo.toFixed(2), close: +close.toFixed(2), volume: vol });
    price = close; t += stepSec;
  }
  return { history: bars.slice(0, decisionIdx), future: bars.slice(decisionIdx, total) };
}

/* ============================================================================
   Indicators
============================================================================ */
function computeEMA(bars, period) {
  const k = 2 / (period + 1); let ema = null; const out = [];
  for (const b of bars) { ema = ema === null ? b.close : b.close * k + ema * (1 - k); out.push({ time: b.time, value: +ema.toFixed(4) }); }
  return out;
}
function computeDEMA(bars, period) {
  const ema1 = computeEMA(bars, period);
  const fake = ema1.map(e => ({ time: e.time, close: e.value }));
  const ema2 = computeEMA(fake, period);
  return ema1.map((e, i) => ({ time: e.time, value: +(2 * e.value - ema2[i].value).toFixed(4) }));
}
function computeVWAP(bars) {
  let cumPV = 0, cumV = 0; const out = [];
  for (const b of bars) { const typical = (b.high + b.low + b.close) / 3; cumPV += typical * (b.volume || 1); cumV += (b.volume || 1); out.push({ time: b.time, value: +(cumPV / cumV).toFixed(4) }); }
  return out;
}
function computeATR(bars, period = 14) {
  if (bars.length < period + 1) return 0;
  let sum = 0;
  for (let i = bars.length - period; i < bars.length; i++) {
    const prev = bars[i - 1]; const cur = bars[i];
    sum += Math.max(cur.high - cur.low, Math.abs(cur.high - prev.close), Math.abs(cur.low - prev.close));
  }
  return sum / period;
}

/* ============================================================================
   Setup classifier
============================================================================ */
function classifySetup({ history, atr, vwap, ema }) {
  const L = history.length;
  if (L < 25 || !atr) return { id: 'neutral', en: 'Neutral Tape', pt: 'Tape Neutro', bias: 'skip' };
  const last = history[L - 1]; const prev = history[L - 2];
  const highs = history.map(b => b.high); const lows = history.map(b => b.low);
  const priorHigh = Math.max(...highs.slice(-30, -4)); const priorLow = Math.min(...lows.slice(-30, -4));
  for (let i = Math.max(0, L - 3); i < L; i++) {
    const b = history[i];
    if (b.low < priorLow && b.close > priorLow && last.close > priorLow)
      return { id: 'liq_sweep_long', en: 'Liquidity Sweep — Long', pt: 'Varredura de Liquidez — Long', bias: 'long' };
    if (b.high > priorHigh && b.close < priorHigh && last.close < priorHigh)
      return { id: 'liq_sweep_short', en: 'Liquidity Sweep — Short', pt: 'Varredura de Liquidez — Short', bias: 'short' };
  }
  if (vwap) {
    if (prev.close < vwap && last.close > vwap) return { id: 'vwap_reclaim', en: 'VWAP Reclaim', pt: 'Reclaim de VWAP', bias: 'long' };
    if (prev.close > vwap && last.close < vwap) return { id: 'vwap_reject', en: 'VWAP Rejection', pt: 'Rejeição do VWAP', bias: 'short' };
  }
  const or = history.slice(0, 6);
  const orh = Math.max(...or.map(b => b.high)); const orl = Math.min(...or.map(b => b.low));
  if (Math.abs(last.close - orh) < atr * 2 && last.close > orh) return { id: 'orb_long', en: 'Opening Range Breakout — Long', pt: 'Rompimento do Range de Abertura — Long', bias: 'long' };
  if (Math.abs(last.close - orl) < atr * 2 && last.close < orl) return { id: 'orb_short', en: 'Opening Range Breakout — Short', pt: 'Rompimento do Range de Abertura — Short', bias: 'short' };
  const last10 = history.slice(-10);
  const recentLow = Math.min(...last10.map(b => b.low)); const priorLow20 = Math.min(...lows.slice(-30, -10));
  const recentHigh = Math.max(...last10.map(b => b.high)); const priorHigh20 = Math.max(...highs.slice(-30, -10));
  if (recentLow < priorLow20 && last.close > priorLow20) return { id: 'failed_breakdown', en: 'Failed Breakdown', pt: 'Rompimento Falho de Baixa', bias: 'long' };
  if (recentHigh > priorHigh20 && last.close < priorHigh20) return { id: 'failed_breakout', en: 'Failed Breakout', pt: 'Rompimento Falho de Alta', bias: 'short' };
  if (ema) {
    const dist = last.close - ema; const nearEma = Math.abs(dist) < atr * 0.9;
    if (nearEma && last.close > last.open && dist < 0) return { id: 'pullback_long', en: 'Trend Pullback — Long', pt: 'Pullback de Tendência — Long', bias: 'long' };
    if (nearEma && last.close < last.open && dist > 0) return { id: 'pullback_short', en: 'Trend Pullback — Short', pt: 'Pullback de Tendência — Short', bias: 'short' };
  }
  const r20h = Math.max(...highs.slice(-20)); const r20l = Math.min(...lows.slice(-20));
  const range = r20h - r20l;
  if (range > atr * 4) {
    const mid = (r20h + r20l) / 2; const topZone = r20h - atr * 0.6; const botZone = r20l + atr * 0.6;
    if (last.high > topZone && last.close < last.high - atr * 0.3 && last.close > mid)
      return { id: 'range_fade_short', en: 'Range Fade — Short', pt: 'Fade de Range — Short', bias: 'short' };
    if (last.low < botZone && last.close > last.low + atr * 0.3 && last.close < mid)
      return { id: 'range_fade_long', en: 'Range Fade — Long', pt: 'Fade de Range — Long', bias: 'long' };
  }
  const anchor = history[Math.max(0, L - 6)]; const move = last.close - anchor.open;
  if (move > atr * 1.5) return { id: 'momentum_long', en: 'Momentum Push — Long', pt: 'Impulso — Long', bias: 'long' };
  if (move < -atr * 1.5) return { id: 'momentum_short', en: 'Momentum Push — Short', pt: 'Impulso — Short', bias: 'short' };
  return { id: 'consolidation', en: 'Consolidation', pt: 'Consolidação', bias: 'skip' };
}

/* ============================================================================
   Trap detector
============================================================================ */
function detectTrap(history) {
  const L = history.length;
  if (L < 20) return null;
  const atr = computeATR(history, 14) || 1;
  const last = history[L - 1];
  const lastBody = Math.abs(last.close - last.open);
  const upperWick = last.high - Math.max(last.open, last.close);
  const lowerWick = Math.min(last.open, last.close) - last.low;
  if (lastBody > atr * 1.5) return { key: 'trapOversizedBar', vars: { ratio: (lastBody / atr).toFixed(1) }, severity: 'warn' };
  const totalRange = last.high - last.low || 1;
  if (upperWick / totalRange > 0.55 && upperWick > atr * 0.6) return { key: 'trapLongWick', vars: { side: '__sideUpper' }, severity: 'warn', side: 'upper' };
  if (lowerWick / totalRange > 0.55 && lowerWick > atr * 0.6) return { key: 'trapLongWick', vars: { side: '__sideLower' }, severity: 'warn', side: 'lower' };
  const vwapArr = computeVWAP(history);
  const last8 = history.slice(-8); const last8Vwap = vwapArr.slice(-8);
  let crossings = 0;
  for (let i = 1; i < last8.length; i++) {
    const prevAbove = last8[i - 1].close > last8Vwap[i - 1].value;
    const currAbove = last8[i].close > last8Vwap[i].value;
    if (prevAbove !== currAbove) crossings++;
  }
  if (crossings >= 4) return { key: 'trapVwapWhipsaw', vars: { count: crossings }, severity: 'warn' };
  if (L >= 4) {
    const b1 = history[L - 3], b2 = history[L - 2], b3 = history[L - 1];
    const pushUp = b3.close > b1.close; const pushDown = b3.close < b1.close;
    const volDecreasing = (b3.volume || 0) < (b2.volume || 0) && (b2.volume || 0) < (b1.volume || 0);
    if (volDecreasing && (pushUp || pushDown)) return { key: 'trapVolumeDiverge', vars: { dir: pushUp ? '__dirUp' : '__dirDown' }, severity: 'warn', dir: pushUp ? 'up' : 'down' };
  }
  if (L >= 6) {
    const lookback = history.slice(-4); const prior = history.slice(-10, -4);
    const priorHigh = Math.max(...prior.map(b => b.high)); const priorLow = Math.min(...prior.map(b => b.low));
    const brokeHigh = lookback.some(b => b.high > priorHigh); const brokeLow = lookback.some(b => b.low < priorLow);
    if (brokeHigh && last.close < priorHigh) return { key: 'trapFailedBreak', vars: { level: 'PDH' }, severity: 'warn', level: 'high' };
    if (brokeLow && last.close > priorLow) return { key: 'trapFailedBreak', vars: { level: 'PDL' }, severity: 'warn', level: 'low' };
  }
  return null;
}

/* ============================================================================
   Debrief axes
============================================================================ */
function analyzeDebrief(history, aiDecision) {
  const entry = history[history.length - 1].close;
  const atr = computeATR(history, 14) || 1;
  const last20 = history.slice(-20);
  let hh = 0, ll = 0;
  for (let i = 1; i < last20.length; i++) {
    if (last20[i].high > last20[i - 1].high) hh++;
    if (last20[i].low  < last20[i - 1].low)  ll++;
  }
  const totalPairs = Math.max(1, last20.length - 1);
  let structureBias = 'neutral', structureKey = 'dStructureMixed';
  if (hh / totalPairs > 0.6 && ll / totalPairs < 0.4) { structureBias = 'long';  structureKey = 'dStructureBull'; }
  else if (ll / totalPairs > 0.6 && hh / totalPairs < 0.4) { structureBias = 'short'; structureKey = 'dStructureBear'; }
  const last10 = history.slice(-10);
  let upVol = 0, downVol = 0;
  for (const b of last10) { if (b.close >= b.open) upVol += b.volume || 0; else downVol += b.volume || 0; }
  const totalVol = upVol + downVol || 1;
  const upPct = upVol / totalVol; const downPct = 1 - upPct;
  let volumeBias = 'neutral', volumeKey = 'dVolumeBalanced';
  if (upPct > 0.6) { volumeBias = 'long';  volumeKey = 'dVolumeBull'; }
  else if (upPct < 0.4) { volumeBias = 'short'; volumeKey = 'dVolumeBear'; }
  const mid = Math.floor(history.length / 2);
  const pdh = Math.max(...history.slice(0, mid).map(b => b.high));
  const pdl = Math.min(...history.slice(0, mid).map(b => b.low));
  const onh = Math.max(...history.slice(mid).map(b => b.high));
  const onl = Math.min(...history.slice(mid).map(b => b.low));
  const vwap = computeVWAP(history).slice(-1)[0].value;
  const levels = [
    { name: 'PDH', price: pdh, kind: 'resistance' }, { name: 'PDL', price: pdl, kind: 'support' },
    { name: 'ONH', price: onh, kind: 'resistance' }, { name: 'ONL', price: onl, kind: 'support' },
    { name: 'VWAP', price: vwap, kind: 'pivot' },
  ];
  let nearest = null;
  for (const L of levels) { const d = Math.abs(entry - L.price); if (!nearest || d < nearest.d) nearest = { ...L, d }; }
  let locationBias = 'neutral', locationKey = 'dLocationMid';
  const locationVars = { level: nearest.name, dist: nearest.d.toFixed(2), atr: (nearest.d / atr).toFixed(2) };
  if (nearest.d < atr * 1.5) {
    if (nearest.kind === 'support') { locationBias = 'long';  locationKey = 'dLocationAtSupport'; }
    else if (nearest.kind === 'resistance') { locationBias = 'short'; locationKey = 'dLocationAtResistance'; }
    else { locationKey = 'dLocationAtVwap'; }
  }
  const ema = computeEMA(history, 20).slice(-1)[0].value;
  const vwapBias = entry > vwap ? 'long' : 'short';
  const emaBias  = entry > ema  ? 'long' : 'short';
  const counts = { long: 0, short: 0 };
  for (const b of [vwapBias, emaBias, structureBias, volumeBias]) { if (b === 'long') counts.long++; else if (b === 'short') counts.short++; }
  let confluenceBias = 'neutral', confluenceKey = 'dConfluenceWeak';
  if (aiDecision === 'LONG' && counts.long >= 3) { confluenceBias = 'long';  confluenceKey = 'dConfluenceStrongLong'; }
  else if (aiDecision === 'LONG' && counts.long === 2) { confluenceBias = 'long';  confluenceKey = 'dConfluenceMediumLong'; }
  else if (aiDecision === 'SHORT' && counts.short >= 3) { confluenceBias = 'short'; confluenceKey = 'dConfluenceStrongShort'; }
  else if (aiDecision === 'SHORT' && counts.short === 2) { confluenceBias = 'short'; confluenceKey = 'dConfluenceMediumShort'; }
  return [
    { axis: 'axisStructure',  bias: structureBias,  key: structureKey,  vars: { hh, ll } },
    { axis: 'axisVolume',     bias: volumeBias,     key: volumeKey,     vars: { upPct: Math.round(upPct * 100), downPct: Math.round(downPct * 100) } },
    { axis: 'axisLocation',   bias: locationBias,   key: locationKey,   vars: locationVars },
    { axis: 'axisConfluence', bias: confluenceBias, key: confluenceKey, vars: { longs: counts.long, shorts: counts.short } },
  ];
}

function deriveAiSkipReason(aiData) {
  if (!aiData) return 'aiReasonDefault';
  const s = aiData.setup;
  if (!s || s.bias === 'skip') return 'aiReasonDefault';
  return 'aiReasonShort';
}

/* ============================================================================
   Simulation & analyst
============================================================================ */
function simulateSide(future, entry, side, slPts, tpPts) {
  const slPrice = side === 'LONG' ? entry - slPts : entry + slPts;
  const tpPrice = side === 'LONG' ? entry + tpPts : entry - tpPts;
  for (let i = 0; i < future.length; i++) {
    const b = future[i];
    let hitSL = false, hitTP = false;
    if (side === 'LONG') { if (b.low <= slPrice) hitSL = true; if (b.high >= tpPrice) hitTP = true; }
    else { if (b.high >= slPrice) hitSL = true; if (b.low <= tpPrice) hitTP = true; }
    if (hitSL) return { result: 'LOSS', r: -1, bars: i + 1, exit: slPrice };
    if (hitTP) return { result: 'WIN', r: +(tpPts / slPts).toFixed(2), bars: i + 1, exit: tpPrice };
  }
  const last = future[future.length - 1];
  const diff = side === 'LONG' ? last.close - entry : entry - last.close;
  return { result: 'TIMEOUT', r: +(diff / slPts).toFixed(2), bars: future.length, exit: last.close };
}
const REF_SL = 12, REF_TP = 24;
function analyzePuzzle(history, future) {
  const entry = history[history.length - 1].close;
  const atr = computeATR(history, 14) || 1;
  const vwap = computeVWAP(history).slice(-1)[0].value;
  const ema = computeEMA(history, 20).slice(-1)[0].value;
  const setup = classifySetup({ history, atr, vwap, ema });
  const longOut = simulateSide(future, entry, 'LONG', REF_SL, REF_TP);
  const shortOut = simulateSide(future, entry, 'SHORT', REF_SL, REF_TP);
  const skipOut = { result: 'SKIP', r: 0, bars: 0, exit: entry };
  const outcomes = { LONG: longOut, SHORT: shortOut, SKIP: skipOut };
  const opts = [
    { d: 'LONG', r: longOut.r, bars: longOut.bars || 999 },
    { d: 'SHORT', r: shortOut.r, bars: shortOut.bars || 999 },
    { d: 'SKIP', r: 0, bars: 0 },
  ];
  opts.sort((a, b) => (b.r !== a.r ? b.r - a.r : a.bars - b.bars));
  const decision = opts[0].r > 0.5 ? opts[0].d : 'SKIP';
  const high = Math.max(...history.map(b => b.high));
  const low = Math.min(...history.map(b => b.low));
  const range = high - low;
  const distVwap = entry - vwap;
  return {
    decision, setup, outcomes, entryPrice: entry, atr, vwap, range, high, low,
    vwapDir: distVwap >= 0 ? 'above' : 'below',
    distVwapAbs: Math.abs(distVwap),
    atrPct: Math.abs(distVwap) / (atr || 1),
    lastClose: entry,
  };
}

/* ============================================================================
   Chart
============================================================================ */
function TradingChart({ historyData, replayData, showVwap, showEma, showDema, showLevels, showVol, slPrice, tpPrice, entryPrice, puzzleKey }) {
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const candleRef = useRef(null);
  const volRef = useRef(null);
  const emaRef = useRef(null); const demaRef = useRef(null); const vwapRef = useRef(null);
  const slLineRef = useRef(null); const tpLineRef = useRef(null); const entryLineRef = useRef(null);
  const levelLinesRef = useRef([]); const roRef = useRef(null);

  useEffect(() => {
    if (!window.LightweightCharts || !containerRef.current) return;
    const LWC = window.LightweightCharts;
    const el = containerRef.current;
    const chart = LWC.createChart(el, {
      width: el.clientWidth || 800, height: el.clientHeight || 500,
      layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#1f2430' }, horzLines: { color: '#1f2430' } },
      crosshair: { mode: LWC.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#2B2B43', scaleMargins: { top: 0.08, bottom: 0.22 } },
      timeScale: { borderColor: '#2B2B43', timeVisible: true, secondsVisible: false, rightOffset: 6 },
      handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: true },
      handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true },
    });
    const candle = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderUpColor: '#26a69a', borderDownColor: '#ef5350', wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
    const vol = chart.addHistogramSeries({ color: '#26a69a80', priceFormat: { type: 'volume' }, priceScaleId: 'vol', priceLineVisible: false, lastValueVisible: false });
    chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    chartRef.current = chart; candleRef.current = candle; volRef.current = vol;
    const ro = new ResizeObserver(() => {
      if (!containerRef.current || !chartRef.current) return;
      chartRef.current.applyOptions({ width: containerRef.current.clientWidth, height: containerRef.current.clientHeight });
    });
    ro.observe(el); roRef.current = ro;
    return () => {
      ro.disconnect(); try { chart.remove(); } catch (e) {}
      chartRef.current = null; candleRef.current = null; volRef.current = null;
      emaRef.current = null; demaRef.current = null; vwapRef.current = null;
      slLineRef.current = null; tpLineRef.current = null; entryLineRef.current = null;
      levelLinesRef.current = [];
    };
  }, []);

  const allBars = useMemo(() => [...historyData, ...replayData], [historyData, replayData]);

  useEffect(() => {
    if (!candleRef.current || !volRef.current || allBars.length === 0) return;
    candleRef.current.setData(allBars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
    volRef.current.setData(allBars.map(b => ({ time: b.time, value: b.volume || 1000, color: b.close >= b.open ? 'rgba(38,166,154,0.45)' : 'rgba(239,83,80,0.45)' })));
    volRef.current.applyOptions({ visible: !!showVol });
  }, [allBars, showVol]);

  useEffect(() => {
    const chart = chartRef.current;
    if (!chart || allBars.length === 0) return;
    const ensureSeries = (ref, options, data) => {
      if (!ref.current) ref.current = chart.addLineSeries({ priceLineVisible: false, lastValueVisible: false, ...options });
      ref.current.setData(data);
    };
    const removeSeries = (ref) => { if (ref.current) { try { chart.removeSeries(ref.current); } catch (e) {} ref.current = null; } };
    if (showEma) ensureSeries(emaRef, { color: '#2962FF', lineWidth: 2 }, computeEMA(allBars, Math.min(200, Math.max(20, Math.floor(allBars.length / 3)))));
    else removeSeries(emaRef);
    if (showDema) ensureSeries(demaRef, { color: '#FF9800', lineWidth: 2 }, computeDEMA(allBars, 15));
    else removeSeries(demaRef);
    if (showVwap) ensureSeries(vwapRef, { color: '#9C27B0', lineWidth: 2 }, computeVWAP(allBars));
    else removeSeries(vwapRef);
  }, [allBars, showEma, showDema, showVwap]);

  useEffect(() => {
    const series = candleRef.current; if (!series) return;
    for (const l of levelLinesRef.current) { try { series.removePriceLine(l); } catch (e) {} }
    levelLinesRef.current = [];
    if (!showLevels || historyData.length === 0) return;
    const highs = historyData.map(b => b.high); const lows = historyData.map(b => b.low);
    const mid = Math.floor(historyData.length / 2);
    const pdh = Math.max(...highs.slice(0, mid)); const pdl = Math.min(...lows.slice(0, mid));
    const onh = Math.max(...highs.slice(mid)); const onl = Math.min(...lows.slice(mid));
    const LWC = window.LightweightCharts;
    for (const d of [
      { price: pdh, color: '#ef5350aa', title: 'PDH' }, { price: pdl, color: '#26a69aaa', title: 'PDL' },
      { price: onh, color: '#ef5350aa', title: 'ONH' }, { price: onl, color: '#26a69aaa', title: 'ONL' },
    ]) levelLinesRef.current.push(series.createPriceLine({ price: d.price, color: d.color, lineWidth: 1, lineStyle: LWC.LineStyle.Dotted, axisLabelVisible: true, title: d.title }));
  }, [historyData, showLevels, puzzleKey]);

  useEffect(() => {
    const series = candleRef.current; if (!series) return;
    const LWC = window.LightweightCharts;
    const update = (ref, price, color, title) => {
      if (ref.current) { try { series.removePriceLine(ref.current); } catch (e) {} ref.current = null; }
      if (price !== null && price !== undefined && !Number.isNaN(price)) {
        try { ref.current = series.createPriceLine({ price, color, lineWidth: 2, lineStyle: LWC.LineStyle.Dashed, axisLabelVisible: true, title }); } catch (e) {}
      }
    };
    update(slLineRef, slPrice, '#ef5350', 'STOP');
    update(tpLineRef, tpPrice, '#26a69a', 'TARGET');
    update(entryLineRef, entryPrice, '#2962FF', 'ENTRY');
  }, [slPrice, tpPrice, entryPrice, puzzleKey]);

  useEffect(() => {
    const series = candleRef.current; if (!series) return;
    for (const ref of [slLineRef, tpLineRef, entryLineRef]) {
      if (ref.current) { try { series.removePriceLine(ref.current); } catch (e) {} ref.current = null; }
    }
    for (const l of levelLinesRef.current) { try { series.removePriceLine(l); } catch (e) {} }
    levelLinesRef.current = [];
  }, [puzzleKey]);

  return <div ref={containerRef} className="w-full h-full relative touch-pan-x touch-pan-y" />;
}

  const best = opts.reduce((acc, k) => { const r = outcomes[k]?.r ?? 0; if (!acc || r > acc.r) return { key: k, r }; return acc; }, null);

}

/* ============================================================================
   Debrief axes
============================================================================ */
function DebriefAxesPanel({ axes, aiDecision, userDecision }) {
  const { t } = useT();
  if (!axes || axes.length === 0) return null;
  const dotColor = (bias) => bias === 'long' ? '#26a69a' : bias === 'short' ? '#ef5350' : '#9aa0b4';
  const verdict = (bias) => {
    if (bias === 'neutral') return { key: 'axisNeutral', color: '#9aa0b4' };
    if (bias === aiDecision.toLowerCase()) return { key: 'axisSupports', color: '#26a69a' };
    if (userDecision !== aiDecision && bias === userDecision.toLowerCase()) return { key: 'axisContradicts', color: '#ef5350' };
    return { key: 'axisNeutral', color: '#9aa0b4' };
  };
  return (
    <div className="bg-[#2B2B43]/30 p-3 rounded-lg border border-[#2B2B43]/50">
      <h3 className="text-[11px] uppercase text-gray-400 font-bold tracking-wider mb-1">{t('debriefWhyNot')}</h3>
      <p className="text-[10px] text-gray-500 italic mb-3 leading-snug">{t('debriefWhyNotSub')}</p>
      <div className="space-y-2">
        {axes.map((a, i) => {
          const v = verdict(a.bias);
          return (
            <div key={i} className="flex items-start gap-2">
              <span className="mt-1.5 shrink-0 w-2 h-2 rounded-full" style={{ background: dotColor(a.bias) }} />
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline gap-2 mb-0.5">
                  <span className="text-[10px] uppercase text-gray-500 font-bold tracking-wider">{t(a.axis)}</span>
                  <span className="text-[10px] font-mono" style={{ color: v.color }}>{t(v.key)}</span>
                </div>
                <p className="text-xs text-gray-300 leading-snug">{t(a.key, a.vars)}</p>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BreakdownSection({ title, rows, emptyLabel, subLabel }) {

}
function WeaknessPanel({ breakdown, lang, t }) {
  const toRows = (obj, labelFn) => Object.entries(obj || {}).filter(([_, b]) => b.n >= 2).map(([k, b]) => ({ key: k, label: labelFn(k, b), n: b.n, processAcc: b.n > 0 ? b.processMatch / b.n : 0, outcomeAcc: b.n > 0 ? b.correct / b.n : 0, rSum: b.rSum })).sort((a, b) => a.processAcc - b.processAcc);
  const setupRows = toRows(breakdown.bySetup, (id, b) => lang === 'pt' ? (b.labelPt || id) : (b.labelEn || id));
  const dirRows = toRows(breakdown.byDirection, (k) => k);

                  <StatCell label={t('process')} value={`${processAccuracy}%`} color={processAccuracy >= 60 ? 'text-[#26a69a]' : processAccuracy >= 40 ? 'text-[#ffa726]' : 'text-[#ef5350]'} />
                  <StatCell label={t('solved')} value={stats.solved} />
                  <StatCell label={t('accuracy')} value={`${accuracy}%`} />
                  <StatCell label={t('streak')} value={`${stats.streak} (${t('best')} ${stats.bestStreak})`} color="text-[#26a69a]" />
                  <StatCell label={t('tradesR')} value={`${stats.rSum >= 0 ? '+' : ''}${stats.rSum.toFixed(2)}R`} color={stats.rSum >= 0 ? 'text-[#26a69a]' : 'text-[#ef5350]'} />
                </div>
                <p className="text-[10px] text-gray-600 mt-3 font-mono">{t('processHint')}</p>
                {insight && (<div className="mt-3 pt-3 border-t border-[#2B2B43] text-[11px] leading-relaxed flex gap-2"><div className="w-1 rounded shrink-0" style={{ background: insightColor }} /><span style={{ color: insightColor }}>{insight.text}</span></div>)}
              </>
            )}
          </div>
        </section>
        <WeaknessPanel breakdown={stats.breakdown || emptyBreakdown()} lang={lang} t={t} />
        <JournalPanel entries={journal} lang={lang} t={t} onClear={onClearJournal} />
        <section>
          <div className="text-[11px] uppercase text-gray-500 font-bold tracking-widest mb-6">{t('keyboardShortcuts')}</div>
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            {shortcuts.map((g, i) => (
              <div key={i} className="bg-[#131722] border border-[#2B2B43] rounded-xl p-4">
                <div className="text-gray-500 text-[10px] uppercase font-mono mb-3">{g.phase}</div>
                <div className="space-y-2">
                  {g.keys.map(([key, label], j) => (
                    <div key={j} className="flex items-center justify-between text-xs">
                      <kbd className="px-2 py-1 bg-[#0E1117] border border-[#2B2B43] rounded text-gray-300 font-mono text-[11px] min-w-[28px] text-center">{key}</kbd>
                      <span className="text-gray-400 ml-3 flex-1 text-right">{label}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </section>
        <section className="bg-[#131722] border border-[#2B2B43] rounded-xl p-5 border-l-4 border-l-[#ef5350] flex gap-3">
          <div className="text-[#ef5350] shrink-0 mt-0.5"><WarningIcon /></div>
          <div>
            <div className="text-[11px] uppercase text-[#ef5350] font-bold tracking-widest mb-2">{t('disclaimerTitle')}</div>
            <p className="text-gray-400 text-xs leading-relaxed">{t('disclaimer')}</p>
          </div>
        </section>
        <section className="text-center pb-4">
          <button onClick={onStart} className="px-6 py-3 bg-[#2962FF] hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg transition inline-flex items-center gap-2 text-sm"><PlayIcon /> {t('startTraining')}</button>
          <p className="text-gray-600 text-[11px] mt-4 font-mono">{t('readyToStart')}</p>
          <p className="text-gray-700 text-[10px] mt-6">{t('footerMadeWith')}</p>
        </section>
      </div>
    </div>
  );
}

/* ============================================================================
   App
============================================================================ */
function App() {
  const [lang, setLang] = useState(() => { try { return localStorage.getItem('tape_puzzle_lang') || 'en'; } catch (e) { return 'en'; } });
  useEffect(() => { try { localStorage.setItem('tape_puzzle_lang', lang); } catch (e) {} }, [lang]);
  useEffect(() => { document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en'; }, [lang]);

  // Sound preference — roadmap #28
  const [soundEnabled, setSoundEnabled] = useState(loadSoundPref);
  useEffect(() => { saveSoundPref(soundEnabled); }, [soundEnabled]);
  const sound = useSound(soundEnabled);

  const t = useMemo(() => makeT(lang), [lang]);
  const i18nValue = useMemo(() => ({ lang, t, setLang }), [lang, t]);

  const [stats, setStats] = useState(() => {
    try { const s = localStorage.getItem('tape_puzzle_stats_v3'); if (s) return migrateStats(JSON.parse(s)); } catch (e) {}
    return migrateStats(null);
  });
  useEffect(() => { try { localStorage.setItem('tape_puzzle_stats_v3', JSON.stringify(stats)); } catch (e) {} }, [stats]);

  // Daily freeze reset — roadmap #23
  useEffect(() => {
    setStats(prev => {
      if (prev.freezeAvailable === 0 && prev.freezeUsedAt > 0 && (Date.now() - prev.freezeUsedAt) > FREEZE_WINDOW_MS) {
        return { ...prev, freezeAvailable: 1 };
      }
      return prev;
    });
    // eslint-disable-next-line
  }, []);

  const [journal, setJournal] = useState(() => loadJournal());

  const [timeframe, setTimeframe] = useState('15m');
  const [instrument, setInstrument] = useState('MES');
  const [showVwap, setShowVwap] = useState(true);
  const [showEma, setShowEma] = useState(true);
  const [showDema, setShowDema] = useState(false);
  const [showLevels, setShowLevels] = useState(true);
  const [showVol, setShowVol] = useState(true);

  const [phase, setPhase] = useState('HOME');
  const [puzzleData, setPuzzleData] = useState({ history: [], future: [] });
  const [replayData, setReplayData] = useState([]);
  const [aiData, setAiData] = useState(null);
  const [userDecision, setUserDecision] = useState(null);
  const [entryPrice, setEntryPrice] = useState(null);
  const [slOffset, setSlOffset] = useState(REF_SL);
  const [tpOffset, setTpOffset] = useState(REF_TP);
  const [playbackIdx, setPlaybackIdx] = useState(0);
  const [isPlaying, setIsPlaying] = useState(false);
  const [speed, setSpeed] = useState(3);
  const [tradeResult, setTradeResult] = useState(null);
  const [rMultiple, setRMultiple] = useState(0);
  const [puzzleId, setPuzzleId] = useState(1001);
  const [eloDelta, setEloDelta] = useState(0);
  const [debriefAxes, setDebriefAxes] = useState([]);
  const [trap, setTrap] = useState(null);
  const [skipModalOpen, setSkipModalOpen] = useState(false);
  const [skipReason, setSkipReason] = useState(null);
  const [skipReasonMatch, setSkipReasonMatch] = useState(null);
  const [aiSkipReasonKey, setAiSkipReasonKey] = useState('aiReasonDefault');
  const [freezeUsedThisPuzzle, setFreezeUsedThisPuzzle] = useState(false);
  const [freezeStreakValue, setFreezeStreakValue] = useState(0);

  const loadNewPuzzle = useCallback((tfArg, instrArg) => {
    const tf = tfArg || timeframe; const instr = instrArg || instrument;
    setPhase('LOADING');
    setReplayData([]); setPlaybackIdx(0); setIsPlaying(false);
    setTradeResult(null); setUserDecision(null); setEntryPrice(null);
    setRMultiple(0); setEloDelta(0); setSlOffset(REF_SL); setTpOffset(REF_TP);
    setDebriefAxes([]); setTrap(null); setSkipReason(null); setSkipReasonMatch(null);
    setSkipModalOpen(false); setFreezeUsedThisPuzzle(false); setFreezeStreakValue(0);
    setPuzzleId(p => p + 1);
    setTimeout(() => {
      const data = generateMarketData(tf, instr);
      const analysis = analyzePuzzle(data.history, data.future);
      const detectedTrap = detectTrap(data.history);
      setPuzzleData(data); setAiData(analysis); setTrap(detectedTrap); setPhase('DECISION');
    }, 220);
  }, [timeframe, instrument]);

  const goHome = useCallback(() => { setPhase('HOME'); setIsPlaying(false); setSkipModalOpen(false); }, []);
  const startTraining = useCallback(() => { sound.click(); loadNewPuzzle(timeframe, instrument); }, [loadNewPuzzle, timeframe, instrument, sound]);
  const handleClearJournal = useCallback(() => { clearJournalStorage(); setJournal([]); }, []);

  useEffect(() => {
    if (phase === 'HOME') return;
    loadNewPuzzle(timeframe, instrument);
    // eslint-disable-next-line
  }, [timeframe, instrument]);

  const slPrice = entryPrice !== null && userDecision !== 'SKIP'
    ? (userDecision === 'LONG' ? entryPrice - slOffset : entryPrice + slOffset) : null;
  const tpPrice = entryPrice !== null && userDecision !== 'SKIP'
    ? (userDecision === 'LONG' ? entryPrice + tpOffset : entryPrice - tpOffset) : null;

  const evaluateResult = useCallback((resultType, rMult, extra) => {
    setPhase('RESULT');
    setTradeResult(resultType);
    setRMultiple(rMult ?? 0);
    setIsPlaying(false);

    // Sound — roadmap #28
    if (resultType === 'WIN') sound.win();
    else if (resultType === 'LOSS') sound.loss();
    else if (resultType === 'SKIP') sound.skip();

    const aiDec = aiData ? aiData.decision : 'SKIP';
    const processMatch = userDecision === aiDec;

    const axes = analyzeDebrief(puzzleData.history, aiDec);
    setDebriefAxes(axes);

    const aiReasonKey = deriveAiSkipReason(aiData);
    setAiSkipReasonKey(aiReasonKey);

    let outcomeCorrect = false;
    if (resultType === 'WIN') outcomeCorrect = true;
    else if (resultType === 'SKIP' && userDecision === 'SKIP' && aiDec === 'SKIP') outcomeCorrect = true;
    else if (resultType === 'FLATTEN' && (rMult ?? 0) > 0 && aiDec === userDecision) outcomeCorrect = true;

    let delta = 0;
    if (resultType === 'WIN' || (resultType === 'SKIP' && userDecision === 'SKIP' && aiDec === 'SKIP')) delta = 18;
    else if (resultType === 'FLATTEN' && (rMult ?? 0) > 0) delta = 8;
    else delta = -15;
    setEloDelta(delta);

    const reason = extra?.skipReason ?? null;
    const reasonMatchesAi = extra?.skipReasonMatch ?? null;

    // Freeze logic — roadmap #23
    let freezeConsumed = false;
    let freezeStreak = 0;

    setStats(prev => {
      const newStreak = delta > 0 ? prev.streak + 1 : 0;
      let streakAfter = newStreak;
      let freezeAvailable = prev.freezeAvailable ?? 1;
      let freezeUsedAt = prev.freezeUsedAt ?? 0;

      const freezeReady = freezeAvailable > 0 || (freezeUsedAt > 0 && (Date.now() - freezeUsedAt) > FREEZE_WINDOW_MS);
      if (delta < 0 && prev.streak > 0 && freezeReady) {
        // Consume freeze; preserve streak
        streakAfter = prev.streak;
        freezeAvailable = 0;
        freezeUsedAt = Date.now();
        freezeConsumed = true;
        freezeStreak = prev.streak;
      } else if (freezeAvailable === 0 && freezeUsedAt > 0 && (Date.now() - freezeUsedAt) > FREEZE_WINDOW_MS) {
        // Time has passed; refresh
        freezeAvailable = 1;
      }

      const breakdown = cloneBreakdown(prev.breakdown);
      const patch = { correct: outcomeCorrect, processMatch, r: rMult ?? 0 };
      if (aiData?.setup?.id) {
        const sid = aiData.setup.id;
        recordBucket(breakdown.bySetup, sid, patch);
        if (!breakdown.bySetup[sid].labelEn) { breakdown.bySetup[sid].labelEn = aiData.setup.en; breakdown.bySetup[sid].labelPt = aiData.setup.pt; }
      }
      recordBucket(breakdown.byTimeframe, timeframe, patch);
      recordBucket(breakdown.byDirection, userDecision, patch);
      recordBucket(breakdown.byInstrument, instrument, patch);

      return {
        ...prev,
        elo: Math.max(0, prev.elo + delta),
        solved: prev.solved + 1,
        correct: prev.correct + (outcomeCorrect ? 1 : 0),
        processMatch: (prev.processMatch || 0) + (processMatch ? 1 : 0),
        streak: streakAfter,
        bestStreak: Math.max(prev.bestStreak || 0, streakAfter),
        rSum: +(prev.rSum + (rMult ?? 0)).toFixed(2),
        breakdown,
        freezeAvailable,
        freezeUsedAt,
      };
    });

    // Detect freeze consumption for the banner — use a microtask so state is set after updater
    setTimeout(() => {
      if (freezeConsumed) {
        setFreezeUsedThisPuzzle(true);
        setFreezeStreakValue(freezeStreak);
        sound.freeze();
      }
    }, 0);

    appendJournalEntry({
      ts: Date.now(), puzzleId, instrument, timeframe,
      setup: aiData?.setup ? { id: aiData.setup.id, en: aiData.setup.en, pt: aiData.setup.pt } : null,
      decision: userDecision, aiDecision: aiDec, processMatch,
      outcome: resultType, r: +(rMult ?? 0).toFixed(2),
      entry: entryPrice, slOffset, tpOffset,
      skipReason: reason, skipReasonMatch: reasonMatchesAi,
      trap: trap ? trap.key : null,
      freezeUsed: freezeConsumed,
    });
    setJournal(loadJournal());
  }, [aiData, userDecision, timeframe, instrument, puzzleId, entryPrice, slOffset, tpOffset, puzzleData.history, trap, sound]);

  const handleDecision = useCallback((decision) => {
    if (phase !== 'DECISION') return;
    if (decision === 'SKIP') { sound.click(); setSkipModalOpen(true); return; }
    sound.click();
    setUserDecision(decision);
    const currentPrice = puzzleData.history[puzzleData.history.length - 1].close;
    setEntryPrice(currentPrice);
    setPhase('REPLAY');
  }, [phase, puzzleData.history, sound]);

  const handleSkipReason = useCallback((reasonKey) => {
    if (phase !== 'DECISION') return;
    setSkipModalOpen(false);
    setUserDecision('SKIP');
    setSkipReason(reasonKey);
    const currentPrice = puzzleData.history[puzzleData.history.length - 1].close;
    setEntryPrice(currentPrice);
    const aiDec = aiData?.decision ?? 'SKIP';
    const aiHadEdge = aiDec === 'LONG' || aiDec === 'SHORT';
    const reasonImpliesNoEdge = reasonKey === 'badSetup' || reasonKey === 'noConfluence' || reasonKey === 'unsure';
    const match = aiHadEdge ? false : reasonImpliesNoEdge;
    setSkipReasonMatch(match);
    evaluateResult('SKIP', 0, { skipReason: reasonKey, skipReasonMatch: match });
  }, [phase, puzzleData.history, aiData, evaluateResult]);

  const advancePlayback = useCallback(() => {
    if (phase !== 'REPLAY') return;
    if (playbackIdx >= puzzleData.future.length) { setIsPlaying(false); evaluateResult('TIMEOUT', 0); return; }
    const nextBar = puzzleData.future[playbackIdx];
    setReplayData(prev => [...prev, nextBar]); setPlaybackIdx(prev => prev + 1);
    if (userDecision === 'SKIP') return;
    let hitSL = false, hitTP = false;
    if (userDecision === 'LONG') { if (nextBar.low <= slPrice) hitSL = true; if (nextBar.high >= tpPrice) hitTP = true; }
    else if (userDecision === 'SHORT') { if (nextBar.high >= slPrice) hitSL = true; if (nextBar.low <= tpPrice) hitTP = true; }
    if (hitSL && hitTP) hitTP = false;
    if (hitTP) { const r = +(tpOffset / slOffset).toFixed(2); evaluateResult('WIN', r); }
    else if (hitSL) { evaluateResult('LOSS', -1); }
  }, [phase, playbackIdx, puzzleData.future, userDecision, slPrice, tpPrice, slOffset, tpOffset, evaluateResult]);

  useEffect(() => {
    if (!isPlaying || phase !== 'REPLAY') return;
    const intervalMs = Math.max(60, 450 / speed);
    const id = setInterval(advancePlayback, intervalMs);
    return () => clearInterval(id);
  }, [isPlaying, speed, advancePlayback, phase]);

  const handleFlatten = useCallback(() => {
    if (phase !== 'REPLAY' || replayData.length === 0) { evaluateResult('FLATTEN', 0); return; }
    const last = replayData[replayData.length - 1].close;
    const diff = userDecision === 'LONG' ? last - entryPrice : entryPrice - last;
    const r = +(diff / slOffset).toFixed(2);
    evaluateResult('FLATTEN', r);
  }, [phase, replayData, entryPrice, userDecision, slOffset, evaluateResult]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.target && ['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.key === 'Escape') {
        if (skipModalOpen) { setSkipModalOpen(false); return; }
        if (phase !== 'HOME') { goHome(); return; }
      }
      if (skipModalOpen) {
        const map = { '1': 'badSetup', '2': 'farFromVwap', '3': 'againstTrend', '4': 'noConfluence', '5': 'unsure' };
        if (map[e.key]) { handleSkipReason(map[e.key]); return; }
        return;
      }
      if (phase === 'DECISION') {
        if (e.key === 'l' || e.key === 'L') handleDecision('LONG');
        if (e.key === 's' || e.key === 'S') handleDecision('SHORT');
        if (e.key === 'k' || e.key === 'K') handleDecision('SKIP');
      } else if (phase === 'REPLAY') {
        if (e.key === ' ') { e.preventDefault(); setIsPlaying(p => !p); }
        if (e.key === 'ArrowRight') advancePlayback();
        if (e.key === 'f' || e.key === 'F') handleFlatten();
      } else if (phase === 'RESULT') {
        if (e.key === 'n' || e.key === 'N') loadNewPuzzle();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [phase, handleDecision, advancePlayback, handleFlatten, loadNewPuzzle, goHome, skipModalOpen, handleSkipReason]);

  const accuracy = stats.solved === 0 ? 0 : Math.round((stats.correct / stats.solved) * 100);
  const processAccuracy = stats.solved === 0 ? 0 : Math.round(((stats.processMatch || 0) / stats.solved) * 100);
  const freezeReady = isFreezeReady(stats);

  const contextRows = useMemo(() => {
    if (!aiData || puzzleData.history.length === 0) return [];
    const h = puzzleData.history;
    const first = h[0].open; const last = h[h.length - 1].close;
    const openDiff = ((last - first) / first) * 100;
    const atr = aiData.atr || 0; const vwapDist = last - aiData.vwap;
    const range = aiData.range || 0;
    const clsPct = (v) => v >= 0 ? 'text-[#26a69a]' : 'text-[#ef5350]';
    const fmtPct = (v) => `${v >= 0 ? '+' : ''}${v.toFixed(2)}%`;
    return [
      { k: t('rowSessionMove'), v: fmtPct(openDiff), c: clsPct(openDiff) },
      { k: t('rowRange'), v: `${range.toFixed(1)} pts`, c: 'text-gray-200' },
      { k: t('rowAtr'), v: `${atr.toFixed(2)} pts (${Math.round(atr * 4)} ticks)`, c: 'text-gray-200' },
      { k: t('rowVwap'), v: `${vwapDist >= 0 ? '+' : ''}${vwapDist.toFixed(2)} pts (${atr ? (vwapDist / atr).toFixed(2) : '0'} ATR)`, c: clsPct(vwapDist) },
      { k: t('rowLastClose'), v: last.toFixed(2), c: 'text-white' },
      { k: t('rowOpen'), v: h[0].open.toFixed(2), c: 'text-gray-200' },
    ];
  }, [aiData, puzzleData.history, t]);

  const contextText = useMemo(() => {
    if (!aiData) return '';
    const vwapDir = aiData.vwapDir === 'above' ? t('vwapAbove') : t('vwapBelow');
    return t('contextTpl', { range: aiData.range.toFixed(1), vwapDir, distVwap: aiData.distVwapAbs.toFixed(2), atrPct: aiData.atrPct.toFixed(2), atr: aiData.atr.toFixed(2), lastClose: aiData.lastClose.toFixed(2) });
  }, [aiData, t, lang]);

  const setupLabel = aiData?.setup ? (lang === 'pt' ? aiData.setup.pt : aiData.setup.en) : '';
  const rrRatio = +(tpOffset / slOffset).toFixed(2);

  const resultTitle = useMemo(() => {
    if (!tradeResult) return '';
    if (tradeResult === 'WIN') return `${t('resultWin')} (+${rMultiple}R)`;
    if (tradeResult === 'LOSS') return `${t('resultLoss')} (-1.0R)`;
    if (tradeResult === 'TIMEOUT') return `${t('resultTimeout')} (0R)`;
    if (tradeResult === 'FLATTEN') return `${t('resultFlat')} (${rMultiple >= 0 ? '+' : ''}${rMultiple}R)`;
    return `${t('resultSkip')} (0R)`;
  }, [tradeResult, rMultiple, t]);

  const isHome = phase === 'HOME';

  return (
    <I18nCtx.Provider value={i18nValue}>
      <div className="flex flex-col h-screen w-screen bg-[#0E1117] text-gray-200 overflow-hidden select-none">

        <SkipReasonModal open={skipModalOpen} onSelect={handleSkipReason} onCancel={() => setSkipModalOpen(false)} />

        {!isHome && (
          <div className="flex flex-wrap justify-between items-center px-3 md:px-4 py-2 gap-y-1.5 bg-[#131722] border-b border-[#2B2B43] z-10 text-xs md:text-sm">
            <div className="flex items-center space-x-2 md:space-x-3">
              <button onClick={goHome} className="flex items-center space-x-1.5 text-white font-bold hover:text-[#6f8cff] transition" title={t('home')}>
                <HomeIcon /><span className="hidden sm:inline">{t('appName')}</span>
              </button>
              <div className="flex space-x-1 bg-[#1A1E29] p-1 rounded border border-[#2B2B43]">
                {['MES', 'MNQ'].map(i => (<button key={i} onClick={() => { sound.click(); setInstrument(i); }} className={`px-2 py-0.5 rounded ${instrument === i ? 'bg-[#2962FF] text-white font-bold' : 'text-gray-400 hover:text-white'}`}>{i}</button>))}
              </div>
            </div>
            <div className="hidden lg:flex items-center space-x-5 font-mono">
              <StatCell label={t('elo')} value={stats.elo} />
              <StatCell label={t('process')} value={`${processAccuracy}%`} color={processAccuracy >= 60 ? 'text-[#26a69a]' : processAccuracy >= 40 ? 'text-[#ffa726]' : 'text-[#ef5350]'} />
              <StatCell label={t('solved')} value={stats.solved} />
              <StatCell label={t('accuracy')} value={`${accuracy}%`} />
              <StatCell label={t('streak')} value={`${stats.streak} (${t('best')} ${stats.bestStreak})`} color="text-[#26a69a]" />
              <StatCell label={t('tradesR')} value={`${stats.rSum >= 0 ? '+' : ''}${stats.rSum.toFixed(2)}R`} color={stats.rSum >= 0 ? 'text-[#26a69a]' : 'text-[#ef5350]'} />
            </div>
            <div className="flex items-center space-x-2 ml-auto md:ml-0">
              <div className={`hidden sm:flex items-center gap-1 text-[11px] font-mono px-2 py-1 rounded border ${freezeReady ? 'border-[#6f8cff]/40 text-[#6f8cff] bg-[#6f8cff]/5' : 'border-[#2B2B43] text-gray-600'}`} title={freezeReady ? t('freezeAvailable') : t('freezeUsed')}>
                <SnowflakeIcon /> {freezeReady ? '1' : '0'}
              </div>
              <div className="flex space-x-1 bg-[#1A1E29] p-1 rounded border border-[#2B2B43]">
                {['1m', '5m', '15m', '1h'].map(tf => (<button key={tf} onClick={() => { sound.click(); setTimeframe(tf); }} className={`px-1.5 md:px-2 py-0.5 rounded ${timeframe === tf ? 'bg-[#2962FF] text-white font-bold' : 'text-gray-400 hover:text-white'}`}>{tf}</button>))}
              </div>
              <div className="hidden md:flex space-x-1 border-l border-[#2B2B43] pl-2">
                <ToggleBtn label="VWAP" on={showVwap} setter={setShowVwap} />
                <ToggleBtn label="200 EMA" on={showEma} setter={setShowEma} />
                <ToggleBtn label="DEMA" on={showDema} setter={setShowDema} />
                <ToggleBtn label="Levels" on={showLevels} setter={setShowLevels} />
                <ToggleBtn label="Vol" on={showVol} setter={setShowVol} />
              </div>
              <SoundToggle enabled={soundEnabled} setEnabled={setSoundEnabled} />
              <LanguageToggle lang={lang} setLang={setLang} />
            </div>
          </div>
        )}

        {isHome ? (
          <HomeScreen
            stats={stats}
            journal={journal}
            onStart={startTraining}
            onClearJournal={handleClearJournal}
            lang={lang}
            setLang={setLang}
            soundEnabled={soundEnabled}
            setSoundEnabled={setSoundEnabled}
          />
        ) : (
          <div className="flex flex-1 overflow-hidden relative min-h-0 flex-col md:flex-row">
            {/* Chart — top on mobile, left on desktop */}
            <div className="h-[40vh] md:h-auto md:flex-1 bg-[#131722] relative min-w-0 shrink-0 md:shrink">
              {phase === 'LOADING' && (
                <div className="absolute inset-0 z-30 bg-[#131722]/85 flex flex-col items-center justify-center backdrop-blur-sm">
                  <div className="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500 mb-3" />
                  <span className="text-sm font-mono text-gray-400">{t('loading')} #{puzzleId}…</span>
                </div>
              )}
              <TradingChart
                puzzleKey={puzzleId}
                historyData={puzzleData.history} replayData={replayData}
                showVwap={showVwap} showEma={showEma} showDema={showDema}
                showLevels={showLevels} showVol={showVol}
                slPrice={slPrice} tpPrice={tpPrice} entryPrice={entryPrice}
              />
            </div>

            {/* Sidebar — bottom on mobile, right on desktop */}
            <div className="flex-1 min-h-0 md:flex-none md:w-[380px] md:shrink-0 bg-[#1A1E29] border-t md:border-t-0 md:border-l border-[#2B2B43] flex flex-col p-3 md:p-4 overflow-y-auto">
              <div className="flex justify-between items-start mb-4 border-b border-[#2B2B43] pb-3">
                <div className="min-w-0">
                  <h2 className="text-sm font-bold text-white truncate">{instrument} • {timeframe} • {t('headerDecision')}</h2>
                  <p className="text-xs text-gray-400">{t('decisionQ')}</p>
                  {aiData?.setup && (
                    <div className="mt-2 flex flex-wrap gap-1">
                      <span className="text-[10px] font-mono bg-[#2B2B43] text-gray-300 px-2 py-0.5 rounded">{t('playbook')} · {t('ruleGraded')}</span>
                      <span className="text-[10px] font-mono bg-[#2962FF]/20 text-[#6f8cff] px-2 py-0.5 rounded">{setupLabel}</span>
                    </div>
                  )}
                </div>
                <span className="text-[11px] font-mono bg-[#2B2B43] px-2 py-0.5 rounded text-gray-300 shrink-0 ml-2">#{puzzleId}</span>
              </div>

              {phase === 'DECISION' && aiData && (
                <div className="space-y-4 mb-4">
                  {trap && <TrapBanner trap={trap} />}
                  <div className="bg-[#2B2B43]/30 p-3 rounded-lg border border-[#2B2B43]/50">
                    <h3 className="text-[11px] uppercase text-gray-400 font-bold tracking-wider mb-1">{t('marketContext')}</h3>
                    <p className="text-xs text-gray-300 leading-relaxed">{contextText}</p>
                  </div>
                  <div>
                    <h3 className="text-xs font-semibold mb-2 text-gray-300">{t('yourCall')}</h3>
                    <div className="grid grid-cols-3 gap-2">
                      <button onClick={() => handleDecision('LONG')} className="py-3 md:py-2.5 bg-gradient-to-t from-[#26a69a] to-[#33b8ab] text-white rounded font-bold shadow hover:opacity-90 transition">{t('long')}</button>
                      <button onClick={() => handleDecision('SHORT')} className="py-3 md:py-2.5 bg-gradient-to-t from-[#ef5350] to-[#f46c69] text-white rounded font-bold shadow hover:opacity-90 transition">{t('short')}</button>
                      <button onClick={() => handleDecision('SKIP')} className="py-3 md:py-2.5 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded font-bold shadow transition">{t('skip')}</button>
                    </div>
                    <p className="text-[10px] text-gray-500 mt-2 text-center font-mono hidden md:block">{t('shortcutsLsk')}</p>
                  </div>
                </div>
              )}

              {phase === 'REPLAY' && (
                <div className="space-y-4 mb-4">
                  <div className="bg-[#2B2B43]/30 p-3 rounded-lg border border-[#2B2B43]/50 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-semibold text-gray-300">{t('bracket')}</span>
                      <span className={`text-[11px] px-2 py-0.5 rounded font-bold ${userDecision === 'LONG' ? 'bg-[#26a69a]/20 text-[#26a69a]' : 'bg-[#ef5350]/20 text-[#ef5350]'}`}>{userDecision} · RR {rrRatio}:1</span>
                    </div>
                    <div className="grid grid-cols-3 gap-2 text-[11px] font-mono">
                      <div className="bg-[#131722] p-2 rounded border border-[#2B2B43]"><div className="text-gray-500 text-[10px] uppercase">{t('entry')}</div><div className="text-[#2962FF] font-bold">{entryPrice ? entryPrice.toFixed(2) : '—'}</div></div>
                      <div className="bg-[#131722] p-2 rounded border border-[#2B2B43]"><div className="text-gray-500 text-[10px] uppercase">{t('stop')}</div><div className="text-[#ef5350] font-bold">{slPrice !== null ? slPrice.toFixed(2) : '—'}</div></div>
                      <div className="bg-[#131722] p-2 rounded border border-[#2B2B43]"><div className="text-gray-500 text-[10px] uppercase">{t('target')}</div><div className="text-[#26a69a] font-bold">{tpPrice !== null ? tpPrice.toFixed(2) : '—'}</div></div>
                    </div>
                    <div>
                      <div className="flex justify-between text-[11px] text-gray-400 mb-1"><span>{t('stopLoss')}</span><span className="font-mono text-white">{slOffset} pts</span></div>
                      <input type="range" min="4" max="40" value={slOffset} onChange={(e) => setSlOffset(Number(e.target.value))} className="w-full" />
                    </div>
                    <div>
                      <div className="flex justify-between text-[11px] text-gray-400 mb-1"><span>{t('takeProfit')}</span><span className="font-mono text-white">{tpOffset} pts</span></div>
                      <input type="range" min="8" max="80" value={tpOffset} onChange={(e) => setTpOffset(Number(e.target.value))} className="w-full" />
                    </div>
                  </div>
                  <div className="flex space-x-2">
                    <button onClick={() => setIsPlaying(p => !p)} className="flex-1 py-3 md:py-2.5 bg-blue-600 hover:bg-blue-500 rounded flex items-center justify-center text-white font-bold transition">
                      {isPlaying ? <PauseIcon /> : <PlayIcon />}<span className="ml-1.5">{isPlaying ? t('pause') : t('play')}</span>
                    </button>
                    <button onClick={advancePlayback} disabled={isPlaying} className="px-3 bg-gray-700 hover:bg-gray-600 disabled:opacity-50 rounded flex items-center justify-center text-white transition"><StepIcon /></button>
                    <button onClick={handleFlatten} className="px-3 bg-[#ef5350]/20 text-[#ef5350] hover:bg-[#ef5350]/30 rounded font-bold transition">{t('flatten')}</button>
                  </div>
                  <div className="flex items-center justify-between bg-[#131722] p-2 rounded border border-[#2B2B43]">
                    <span className="text-[11px] text-gray-400">{t('speed')}</span>
                    <div className="flex space-x-1">
                      {[1, 3, 10, 30].map(s => (<button key={s} onClick={() => setSpeed(s)} className={`px-2 py-0.5 rounded text-[11px] font-mono ${speed === s ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'}`}>{s}x</button>))}
                    </div>
                  </div>
                  <div className="text-[11px] text-gray-500 font-mono flex justify-between">
                    <span>{t('bar')} {playbackIdx}/{puzzleData.future.length}</span>
                    <span className="hidden md:inline">{t('spacePlayHint')}</span>
                  </div>
                </div>
              )}

              {phase === 'RESULT' && aiData && (
                <div className="space-y-4 mb-4">
                  <div className={`p-3 rounded-lg border ${
                    tradeResult === 'WIN' ? 'bg-[#26a69a]/10 border-[#26a69a]/50 text-[#26a69a]' :
                    tradeResult === 'LOSS' ? 'bg-[#ef5350]/10 border-[#ef5350]/50 text-[#ef5350]' :
                    tradeResult === 'SKIP' && userDecision === aiData.decision ? 'bg-blue-500/10 border-blue-500/50 text-blue-400' :
                    'bg-gray-800/50 border-gray-700 text-gray-300'
                  }`}>
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-bold text-sm">{resultTitle}</span>
                      <span className="text-xs font-mono font-bold uppercase">{userDecision}</span>
                    </div>
                    <p className="text-xs text-gray-300"><span className="text-gray-400">{t('correctMove')}:</span> <strong className="text-white">{aiData.decision}</strong></p>
                    <p className="text-xs mt-1"><span className="text-gray-400">{t('eloDelta')}:</span>{' '}<strong className={eloDelta >= 0 ? 'text-[#26a69a]' : 'text-[#ef5350]'}>{eloDelta >= 0 ? `+${eloDelta}` : eloDelta}</strong></p>
                  </div>
                  {freezeUsedThisPuzzle && <FreezeBanner streak={freezeStreakValue} />}
                  <CounterfactualPanel outcomes={aiData.outcomes} userDecision={userDecision} tradeResult={tradeResult} userR={rMultiple} />
                  <DebriefAxesPanel axes={debriefAxes} aiDecision={aiData.decision} userDecision={userDecision} />
                  {userDecision === 'SKIP' && skipReason && (<SkipReasonDebrief userReason={skipReason} aiReasonKey={aiSkipReasonKey} match={skipReasonMatch} />)}
                  <div className="bg-[#2B2B43]/30 p-3 rounded-lg border border-[#2B2B43]/50">
                    <h3 className="text-[11px] uppercase text-gray-400 font-bold tracking-wider mb-1">{t('debrief')}</h3>
                    <p className="text-xs text-gray-300 leading-relaxed mb-2">{t(`expl_${aiData.decision}`)}</p>
                    <div className="text-[10px] text-gray-500 font-mono border-t border-[#2B2B43] pt-2">{t('playbook')}: <span className="text-gray-300">{setupLabel}</span></div>
                  </div>
                  <button onClick={() => loadNewPuzzle()} className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg transition flex justify-center items-center">
                    {t('nextPuzzle')}
                    <svg className="ml-1.5 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" /></svg>
                  </button>
                  <p className="text-[10px] text-gray-500 text-center font-mono hidden md:block">{t('nextHint')}</p>
                </div>
              )}

              <div className="mt-auto bg-[#131722] p-3 rounded-lg border border-[#2B2B43] space-y-2 text-xs font-mono">
                <div className="text-[11px] text-gray-400 uppercase font-bold tracking-wider mb-2 border-b border-[#2B2B43] pb-1">{t('contextAtDecision')}</div>
                {contextRows.length === 0 && <div className="text-gray-500 text-[11px]">{t('awaitingData')}</div>}
                {contextRows.map((r, i) => (<div key={i} className="flex justify-between"><span className="text-gray-400">{r.k}</span><span className={r.c}>{r.v}</span></div>))}
              </div>
            </div>
          </div>
        )}
      </div>
    </I18nCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
