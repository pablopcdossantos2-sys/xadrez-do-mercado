name: Bootstrap historical market library

on:
  push:
    paths:
      - ".github/workflows/bootstrap-historical-library.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[historical-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build real historical library
        run: |
          python3 scripts/build-historical-library.py \
            --start-date 2026-09-15 \
            --end-date 2026-10-02 \
            --max-sessions 6

      - name: Commit generated library
        run: |
          if git diff --quiet -- public/data/historical; then
            echo "No historical-library changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/historical
          git commit -m "data: bootstrap real historical market library [historical-bootstrap]"
          git push origin HEAD:main
