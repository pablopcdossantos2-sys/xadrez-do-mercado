name: Delete reviewed merged secondary branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-merged-secondary-branches.yml"

permissions:
  contents: write

jobs:
  delete-reviewed-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete secondary branches already merged into main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/curated-real-market-library"
            "feat/free-firstrate-samples"
            "feat/historical-session-windows"
            "fix/incremental-historical-curation"
          )

          for branch in "${branches[@]}"; do
            encoded_ref="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote("heads/" + sys.argv[1], safe=""))' "$branch")"
            code="$(curl --silent --show-error --output /tmp/delete-ref-response.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL/repos/$REPOSITORY/git/refs/$encoded_ref")"

            case "$code" in
              204)
                echo "DELETED: $branch"
                ;;
              404)
                echo "ALREADY ABSENT: $branch"
                ;;
              *)
                echo "FAILED ($code): $branch"
                cat /tmp/delete-ref-response.json
                exit 1
                ;;
            esac
          done
